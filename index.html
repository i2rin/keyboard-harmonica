<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one 16:9 stage locked to the source image; every overlay uses the image's own 1988×1120 coordinates. Black stays pure black so it turns transparent on the display. */
:root {
  --void: #000;          /* transparent on the display */
  --glow: #3cc8ff;       /* matches the X-ray line color */
  --glow-hot: #b8f0ff;
  --glow-dim: rgba(60, 200, 255, .38);
  --ink: #dff7ff;
  --font-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--ink); font-family: var(--font-ja);
  display: grid; place-items: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; box-sizing: border-box;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.stage {
  position: relative; container-type: inline-size;
  width: min(100%, calc(100dvh * 1988 / 1120)); max-width: 100%;
  aspect-ratio: 1988 / 1120;
}
.stage > img, .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage > img { pointer-events: none; }
.stage > canvas { pointer-events: none; }

.head { position: absolute; left: 15.1%; top: 4.2%; right: 15%; }
.head h1 { margin: 0; font-weight: 700; font-size: 2.5cqw; letter-spacing: .06em; color: var(--glow-hot); text-shadow: 0 0 1cqw var(--glow); text-wrap: balance; }
.foot { position: absolute; left: 15.1%; right: 7%; top: 92.4%; display: flex; justify-content: space-between; align-items: baseline; gap: 2cqw; }
.steps { display: flex; gap: 2.2cqw; margin: 0; padding: 0; list-style: none; font-size: 1.3cqw; }
.steps li { color: var(--glow-dim); transition: color .25s, text-shadow .25s; white-space: nowrap; }
.steps li b { font-family: var(--font-data); font-weight: 500; margin-right: .5em; }
.steps li.on { color: var(--glow-hot); text-shadow: 0 0 .8cqw var(--glow); }

.label {
  position: absolute; top: 10.6%; transform: translateX(-50%);
  display: grid; justify-items: center; gap: .2cqw; text-align: center;
  opacity: 0; transition: opacity .2s, left .12s ease-out; pointer-events: none;
}
.label.on { opacity: 1; }
.label .name { font-size: 3.4cqw; font-weight: 700; line-height: 1; color: var(--glow-hot); text-shadow: 0 0 1.2cqw var(--glow); }
.label .hz { font-family: var(--font-data); font-size: 1.15cqw; color: var(--glow); font-variant-numeric: tabular-nums; }
.label .say { font-size: 1.1cqw; color: var(--ink); white-space: nowrap; }

.pad { position: absolute; left: 15.1%; right: 7%; top: 78.6%; height: 12.2%; display: flex; gap: 1.2cqw; }
.key {
  flex: 1; min-width: 0; border-radius: .9cqw; cursor: pointer;
  border: .16cqw solid var(--glow); background: transparent; color: var(--glow-hot);
  font-family: var(--font-ja); display: grid; place-content: center; gap: .3cqw;
  box-shadow: 0 0 .9cqw rgba(60,200,255,.35), inset 0 0 .9cqw rgba(60,200,255,.2);
  transition: background .08s, box-shadow .08s, transform .08s;
  touch-action: none;
}
.key .n { font-size: 3cqw; font-weight: 700; line-height: 1; }
.key .c { font-family: var(--font-data); font-size: 1cqw; color: var(--glow); }
.key.down { background: rgba(60,200,255,.32); transform: translateY(.25cqw); box-shadow: 0 0 2.4cqw var(--glow), inset 0 0 1.6cqw rgba(184,240,255,.6); }
.key:focus-visible { outline: .2cqw solid var(--glow-hot); outline-offset: .3cqw; }
.hint { font-size: 1.1cqw; color: var(--glow-dim); white-space: nowrap; }

.fs { position: absolute; right: 1%; top: 1.5%; font: 500 .9cqw var(--font-ja); color: var(--glow-dim); background: transparent; border: .1cqw solid rgba(60,200,255,.25); border-radius: .5cqw; padding: .4cqw .8cqw; cursor: pointer; }
.fs:focus-visible { outline: .15cqw solid var(--glow); }
:fullscreen .fs { display: none; }

.status { position: absolute; left: 1%; top: 1.5%; font: 500 .9cqw var(--font-ja); color: var(--glow-dim); white-space: nowrap; }
.status::before { content: ""; display: inline-block; width: .6em; height: .6em; border-radius: 50%; margin-right: .5em; background: currentColor; vertical-align: .05em; }
.status.ok { color: var(--glow); }
.unlock {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font: 700 1.6cqw var(--font-ja); color: var(--glow-hot); background: rgba(0,0,0,.85);
  border: .15cqw solid var(--glow); border-radius: 1cqw; padding: 1.4cqw 2.4cqw; cursor: pointer;
  box-shadow: 0 0 2cqw rgba(60,200,255,.4);
}

/* views: #display = transparent screen only, #controller = the visitor's tablet */
body.v-display .pad, body.v-display .hint-local { display: none; }
body:not(.v-display) .hint-remote { display: none; }
.ctrl { display: none; }
body.v-controller .stage { display: none; }
body.v-controller { place-items: stretch; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
body.v-controller .ctrl {
  display: grid; grid-template-rows: auto 1fr auto; gap: clamp(12px, 3vh, 28px);
  width: 100%; height: 100%; max-width: 1400px; margin-inline: auto; min-width: 0;
}
.ctrl header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.ctrl h1 { margin: 0; font-size: clamp(20px, 3.4vw, 34px); font-weight: 700; letter-spacing: .05em; color: var(--glow-hot); text-shadow: 0 0 12px var(--glow); text-wrap: balance; }
.ctrl .cstatus { font-size: 14px; color: var(--glow-dim); white-space: nowrap; }
.ctrl .cstatus.ok { color: var(--glow); }
.ctrl .cstatus::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: currentColor; }
.ctrl .cpad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 18px); min-height: 0; }
.ctrl .key { border-width: 2px; border-radius: 14px; gap: 10px; box-shadow: 0 0 14px rgba(60,200,255,.35), inset 0 0 14px rgba(60,200,255,.2); }
.ctrl .key .n { font-size: clamp(24px, 4.2vw, 56px); white-space: nowrap; }
.ctrl .key .c { font-size: clamp(12px, 1.5vw, 18px); }
.ctrl .key.down { transform: translateY(4px); box-shadow: 0 0 34px var(--glow), inset 0 0 24px rgba(184,240,255,.6); }
.ctrl footer { font-size: clamp(14px, 1.8vw, 20px); color: var(--glow); text-align: center; }
@media (orientation: portrait) { .ctrl .cpad { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>

<script>
(() => {
  const W = 1988, H = 1120;
  // Reed centers measured from the image (x), top of tongue y=393, rivet y=474.
  const REED_X = [455,512,570,632,694,756,816,875,935,997,1059,1121,1181,1244,1310,1374,1441,1508,1573,1634,1695];
  const REED_TOP = 393, REED_BASE = 474, REED_W = 17, VALVE_Y = 512;
  const FIRST_MIDI = 55; // reed 0 = G3, chromatic upward → reed 20 = D#5
  const NOTES = [
    { name: "ド",   code: "C4", midi: 60, key: "a", alt: "1" },
    { name: "レ",   code: "D4", midi: 62, key: "s", alt: "2" },
    { name: "ミ",   code: "E4", midi: 64, key: "d", alt: "3" },
    { name: "ファ", code: "F4", midi: 65, key: "f", alt: "4" },
    { name: "ソ",   code: "G4", midi: 67, key: "g", alt: "5" },
    { name: "ラ",   code: "A4", midi: 69, key: "h", alt: "6" },
    { name: "シ",   code: "B4", midi: 71, key: "j", alt: "7" },
    { name: "ド",   code: "C5", midi: 72, key: "k", alt: "8" },
  ];
  // White keys in the image, measured: [left, right, upper-left, upper-right] (upper part is narrowed by the black keys)
  const KEY_SHAPES = [[1061,1146,1061,1130],[1146,1229,1158,1218],[1229,1310,1245,1310],[1310,1394,1310,1381],
                      [1394,1476,1408,1468],[1476,1557,1495,1547],[1557,1640,1575,1640],[1640,1733,1640,1729]];
  const KEY_TOP = 537, KEY_STEP = 690, KEY_BOTTOM = 788;
  NOTES.forEach((n, i) => { n.keyShape = KEY_SHAPES[i]; });
  NOTES.forEach(n => { n.freq = 440 * Math.pow(2, (n.midi - 69) / 12); n.reed = n.midi - FIRST_MIDI; n.x = REED_X[n.reed]; });

  const VIEW = location.hash === "#display" ? "display" : location.hash === "#controller" ? "controller" : "solo";
  document.body.classList.add("v-" + VIEW);
  addEventListener("hashchange", () => location.reload());

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MIN_HOLD = 0.45; // seconds a quick tap still sounds

  /* ---------- Audio: free-reed voice ---------- */
  let ctx = null, master = null, reedWave = null, noiseBuf = null;
  function initAudio() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .55;
    master.connect(comp).connect(ctx.destination);
    // Free reeds give a bright, buzzy spectrum: strong upper harmonics, even ones a bit weaker.
    const N = 40, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let n = 1; n <= N; n++) {
      let a = 1 / Math.pow(n, 0.85);
      if (n % 2 === 0) a *= 0.62;
      if (n === 2) a *= 1.25;
      im[n] = a * (n % 4 === 3 ? -1 : 1);
    }
    reedWave = ctx.createPeriodicWave(re, im);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function startVoice(f) {
    const t = ctx.currentTime;
    const out = ctx.createGain(); out.gain.value = 0;
    // body resonance + soften the very top
    const peak = ctx.createBiquadFilter(); peak.type = "peaking"; peak.frequency.value = 1400; peak.Q.value = 1.1; peak.gain.value = 5;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = .5;
    lp.frequency.setValueAtTime(1800, t); lp.frequency.linearRampToValueAtTime(5200, t + .06);
    peak.connect(lp).connect(out).connect(master);

    const o1 = ctx.createOscillator(); o1.setPeriodicWave(reedWave);
    const o2 = ctx.createOscillator(); o2.setPeriodicWave(reedWave);
    o1.frequency.value = f; o2.frequency.value = f;
    // reeds speak slightly flat, then settle
    o1.detune.setValueAtTime(-18, t);
    o1.detune.linearRampToValueAtTime(0, t + .07);
    o2.detune.setValueAtTime(-14, t); o2.detune.linearRampToValueAtTime(5, t + .07);
    const g1 = ctx.createGain(); g1.gain.value = .22;
    const g2 = ctx.createGain(); g2.gain.value = .07;
    o1.connect(g1).connect(peak); o2.connect(g2).connect(peak);
    // slow breath wobble
    const lfo = ctx.createOscillator(); lfo.frequency.value = 4.2;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 2.5;
    lfo.connect(lfoAmt); lfoAmt.connect(o1.detune); lfoAmt.connect(o2.detune);
    // breath noise
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf; nz.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = Math.min(f * 6, 6000); nf.Q.value = .9;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(.05, t); ng.gain.linearRampToValueAtTime(.012, t + .12);
    nz.connect(nf).connect(ng).connect(out);

    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(1, t + .035);
    out.gain.linearRampToValueAtTime(.86, t + .18);
    [o1, o2, lfo, nz].forEach(s => s.start(t));
    return { out, srcs: [o1, o2, lfo, nz], t0: t };
  }
  function stopVoice(v) {
    const t = Math.max(ctx.currentTime, v.t0 + MIN_HOLD);
    v.out.gain.cancelScheduledValues(t);
    v.out.gain.setValueAtTime(v.out.gain.value || .86, t);
    v.out.gain.setTargetAtTime(0, t, .03);
    v.srcs.forEach(s => s.stop(t + .25));
    return t;
  }

  /* ---------- State ---------- */
  const active = new Map(); // note index → { voice, start, releaseAt, amp, phase, valve }
  const viz = NOTES.map(() => ({ amp: 0, valve: 0, phase: 0, on: false, since: 0, ringT: 0 }));
  let lastNote = null;

  // What should be sounding = keys held here ∪ keys held on the tablet(s)
  const localHeld = new Set(), remoteHeld = new Set();
  function sync() {
    if (VIEW === "controller") { keys.forEach((b, i) => b.classList.toggle("down", localHeld.has(i))); transport.send([...localHeld]); return; }
    NOTES.forEach((_, i) => {
      const want = localHeld.has(i) || remoteHeld.has(i);
      if (want && !active.has(i)) startNote(i);
      else if (!want && active.has(i)) stopNote(i);
    });
  }
  function press(i) { if (!localHeld.has(i)) { localHeld.add(i); sync(); } }
  function release(i) { if (localHeld.delete(i)) sync(); }

  function startNote(i) {
    initAudio();
    if (active.has(i)) return;
    const v = startVoice(NOTES[i].freq);
    active.set(i, v);
    const z = viz[i]; z.on = true; z.since = performance.now(); z.offAt = 0;
    keys[i].classList.add("down");
    showLabel(i);
    requestWake();
  }
  function stopNote(i) {
    const v = active.get(i);
    if (!v) return;
    active.delete(i);
    const endT = stopVoice(v);
    const z = viz[i];
    z.offAt = performance.now() + Math.max(0, (endT - ctx.currentTime) * 1000);
    keys[i].classList.remove("down");
  }

  /* ---------- UI ---------- */
  const pad = document.getElementById(VIEW === "controller" ? "cpad" : "pad");
  const keys = NOTES.map((n, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key"; b.id = "key-" + n.code;
    b.setAttribute("aria-label", `${n.name}（${n.code}）を鳴らす`);
    b.innerHTML = `<span class="n">${n.name}</span><span class="c">${n.code}</span>`;
    b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); press(i); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => b.addEventListener(ev, () => release(i)));
    b.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(i); } });
    b.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") release(i); });
    b.addEventListener("contextmenu", e => e.preventDefault());
    pad.appendChild(b);
    return b;
  });
  const keyMap = {};
  NOTES.forEach((n, i) => { keyMap[n.key] = i; keyMap[n.alt] = i; });
  addEventListener("keydown", e => { const i = keyMap[e.key.toLowerCase()]; if (i !== undefined && !e.repeat) press(i); });
  addEventListener("keyup", e => { const i = keyMap[e.key.toLowerCase()]; if (i !== undefined) release(i); });
  addEventListener("blur", () => [...localHeld].forEach(release));

  const label = document.getElementById("label");
  const lName = document.getElementById("lName"), lHz = document.getElementById("lHz"), lSay = document.getElementById("lSay");
  function showLabel(i) {
    const n = NOTES[i]; lastNote = i;
    const hz = Math.round(n.freq);
    lName.textContent = n.name;
    lHz.textContent = `${n.code} · ${hz} Hz`;
    lSay.textContent = `リードが1秒間に${hz}回ふるえています`;
    label.style.left = (Math.min(Math.max(n.x, 380), 1620) / W * 100) + "%";
    label.classList.add("on");
  }
  const stepEls = [...document.querySelectorAll("#steps li")];

  document.getElementById("fsBtn").addEventListener("click", () => {
    const el = document.documentElement;
    (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => {});
  });
  let wake = null;
  function requestWake() {
    if (wake || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(w => { wake = w; w.addEventListener("release", () => wake = null); }).catch(() => {});
  }

  /* ---------- Linking the tablet and the display ---------- */
  // Inside claude.ai: the artifact's live room (both devices signed in to the same account).
  // Served by server.js on the venue network: Server-Sent Events, works without internet.
  const statusEl = document.getElementById(VIEW === "controller" ? "cstatus" : "status");
  function setStatus(ok, text) { statusEl.hidden = false; statusEl.textContent = text; statusEl.classList.toggle("ok", ok); }
  const transport = { send() {} };

  function applyRemote(list) {
    remoteHeld.clear();
    (Array.isArray(list) ? list : []).forEach(i => { if (Number.isInteger(i) && i >= 0 && i < NOTES.length) remoteHeld.add(i); });
    sync();
  }

  async function connectRoom() {
    const room = await window.claude.use("room");
    if (!room) { setStatus(false, "接続できません（claude.aiにサインインして開いてください）"); return; }
    if (VIEW === "controller") {
      transport.send = held => room.presence({ role: "controller", held }).catch(() => {});
      transport.send([]);
      room.onPeers(ch => {
        const n = ch.peers.filter(p => p.presence && p.presence.role === "display").length;
        setStatus(n > 0, n > 0 ? "表示画面とつながっています" : "表示画面を探しています");
      });
    } else {
      room.presence({ role: "display" }).catch(() => {});
      room.onPeers(ch => {
        const held = new Set(); let n = 0;
        ch.peers.forEach(p => {
          if (!p.presence || p.presence.role !== "controller") return;
          n++;
          (Array.isArray(p.presence.held) ? p.presence.held : []).forEach(i => held.add(i));
        });
        applyRemote([...held]);
        setStatus(n > 0, n > 0 ? `操作パネル ${n}台とつながっています` : "操作パネルを待っています");
      });
    }
  }

  function connectLocal() {
    if (VIEW === "controller") {
      const id = Math.random().toString(36).slice(2);
      let last = [];
      const post = held => fetch("/held", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, held }) })
        .then(r => { if (!r.ok) throw 0; setStatus(true, "表示画面とつながっています"); })
        .catch(() => setStatus(false, "サーバーにつながりません"));
      transport.send = held => { last = held; post(held); };
      setInterval(() => post(last), 1000); // heartbeat: the server drops a silent tablet's notes
      addEventListener("pagehide", () => navigator.sendBeacon?.("/held", new Blob([JSON.stringify({ id, held: [] })], { type: "application/json" })));
      post([]);
    } else {
      const es = new EventSource("/events");
      es.onmessage = e => { try { const m = JSON.parse(e.data); applyRemote(m.held); setStatus(m.controllers > 0, m.controllers > 0 ? `操作パネル ${m.controllers}台とつながっています` : "操作パネルを待っています"); } catch {} };
      es.onerror = () => { applyRemote([]); setStatus(false, "サーバーにつながりません（再接続中）"); };
    }
  }

  if (VIEW !== "solo") {
    if (window.claude && typeof window.claude.use === "function") connectRoom();
    else if (location.protocol.startsWith("http")) connectLocal();
    else setStatus(false, "server.js から開くと操作パネルとつながります");
  }

  // The display has no buttons, so audio must be unlocked once by a click (or a kiosk autoplay flag).
  if (VIEW === "display") {
    const unlock = document.getElementById("unlock");
    initAudio();
    const check = () => { unlock.hidden = ctx.state === "running"; };
    check();
    ctx.onstatechange = check;
    const go = () => { ctx.resume().then(check); };
    unlock.addEventListener("click", go);
    addEventListener("pointerdown", go);
    addEventListener("keydown", go);
  }

  /* ---------- Visuals ---------- */
  const cv = document.getElementById("fx"), g = cv.getContext("2d");
  let scale = 1;
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    scale = cv.width / W;
  }
  new ResizeObserver(resize).observe(cv); resize();

  // Air path: mouthpiece → tube → reed chamber → the pressed reed → through its open valve
  function airPath(x) {
    return [[100,452],[200,444],[292,434],[350,440],[400,456],[440,452],[x,452],[x,430],[x,476],[x,VALVE_Y+6],[x,VALVE_Y+48]];
  }
  function pointAt(pts, s) {
    let total = 0; const seg = [];
    for (let k = 1; k < pts.length; k++) { const l = Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]); seg.push(l); total += l; }
    let d = s * total;
    for (let k = 0; k < seg.length; k++) {
      if (d <= seg[k]) { const u = d / seg[k]; return [pts[k][0] + (pts[k+1][0]-pts[k][0])*u, pts[k][1] + (pts[k+1][1]-pts[k][1])*u, k]; }
      d -= seg[k];
    }
    const p = pts[pts.length-1]; return [p[0], p[1], seg.length-1];
  }
  const particles = [];
  const rings = [];

  function drawReed(x, dx, alpha, glow) {
    // cantilever: fixed at the rivet, the free tip swings the most
    const steps = 10, left = [], right = [];
    for (let k = 0; k <= steps; k++) {
      const t = k / steps, y = REED_BASE - (REED_BASE - REED_TOP) * t, off = dx * t * t;
      left.push([x - REED_W/2 + off, y]); right.push([x + REED_W/2 + off, y]);
    }
    g.beginPath();
    g.moveTo(left[0][0], left[0][1]);
    left.forEach(p => g.lineTo(p[0], p[1]));
    const tip = right[steps];
    g.quadraticCurveTo((left[steps][0] + tip[0]) / 2, REED_TOP - 5, tip[0], tip[1]);
    for (let k = steps; k >= 0; k--) g.lineTo(right[k][0], right[k][1]);
    g.closePath();
    g.globalAlpha = alpha;
    g.shadowColor = "#3cc8ff"; g.shadowBlur = glow;
    g.fillStyle = "#c8f4ff"; g.fill();
    g.shadowBlur = 0; g.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    g.setTransform(scale, 0, 0, scale, 0, 0);

    let anyOn = false, stage = -1;
    viz.forEach((z, i) => {
      const n = NOTES[i];
      const sounding = z.on && (!z.offAt || now < z.offAt);
      if (z.on && z.offAt && now >= z.offAt) z.on = false;
      const held = sounding ? (now - z.since) / 1000 : 0;
      // reed starts after air reaches it; valve opens immediately with the key
      const targetValve = sounding ? 1 : 0;
      const targetAmp = sounding && held > .06 ? 1 : 0;
      z.valve += (targetValve - z.valve) * Math.min(1, dt * 22);
      z.amp += (targetAmp - z.amp) * Math.min(1, dt * (targetAmp ? 14 : 9));
      if (sounding) { anyOn = true; stage = Math.max(stage, held > .06 ? 2 : held > .02 ? 1 : 0); }
      if (z.amp < .003 && z.valve < .003) return;

      // the pressed key: lit and pushed down a little
      {
        const [L, R, uL, uR] = n.keyShape, dy = z.valve * 6, inset = 3;
        g.beginPath();
        g.moveTo(uL + inset, KEY_TOP + dy); g.lineTo(uR - inset, KEY_TOP + dy);
        g.lineTo(uR - inset, KEY_STEP + dy); g.lineTo(R - inset, KEY_STEP + dy);
        g.lineTo(R - inset, KEY_BOTTOM + dy); g.lineTo(L + inset, KEY_BOTTOM + dy);
        g.lineTo(L + inset, KEY_STEP + dy); g.lineTo(uL + inset, KEY_STEP + dy);
        g.closePath();
        const kg = g.createLinearGradient(0, KEY_TOP, 0, KEY_BOTTOM);
        kg.addColorStop(0, `rgba(184,240,255,${.55 * z.valve})`);
        kg.addColorStop(1, `rgba(60,200,255,${.3 * z.valve})`);
        g.fillStyle = kg;
        g.shadowColor = "#3cc8ff"; g.shadowBlur = 24 * z.valve;
        g.fill();
        g.shadowBlur = 0;
        g.strokeStyle = `rgba(220,248,255,${.95 * z.valve})`; g.lineWidth = 3; g.stroke();
        // link: this key opens that reed's valve
        g.setLineDash([6, 8]);
        g.beginPath(); g.moveTo((uL + uR) / 2, KEY_TOP + dy); g.lineTo(n.x, VALVE_Y + 8);
        g.strokeStyle = `rgba(150,230,255,${.6 * z.valve})`; g.lineWidth = 2.5; g.stroke();
        g.setLineDash([]);
      }

      // valve under the reed
      const vy = VALVE_Y + z.valve * 10;
      g.globalAlpha = .9 * z.valve;
      g.shadowColor = "#3cc8ff"; g.shadowBlur = 14;
      g.fillStyle = "#9fe9ff";
      g.fillRect(n.x - 15, vy - 4, 30, 8);
      g.shadowBlur = 0; g.globalAlpha = 1;

      // cover the still reed in the picture so only the moving one shows
      g.globalAlpha = Math.min(1, z.amp * 1.4) * .92;
      g.fillStyle = "#000";
      g.fillRect(n.x - 15, REED_TOP - 8, 30, REED_BASE - REED_TOP + 4);
      g.globalAlpha = 1;

      // shown slowed down: the real reed moves too fast to see
      const visHz = n.freq / 38;
      z.phase += dt * visHz * Math.PI * 2;
      const A = (reduceMotion ? 3 : 7.5) * z.amp;
      drawReed(n.x, -A, .16 * z.amp, 6);
      drawReed(n.x, A, .16 * z.amp, 6);
      drawReed(n.x, A * Math.sin(z.phase), .95 * Math.max(z.amp, .15), 16 + 10 * z.amp);
      // rivet
      g.beginPath(); g.arc(n.x, REED_BASE - 2, 5, 0, Math.PI * 2);
      g.fillStyle = "#7fdcff"; g.globalAlpha = z.amp; g.fill(); g.globalAlpha = 1;

      if (sounding) {
        // air particles
        const rate = reduceMotion ? 30 : 90;
        z.acc = (z.acc || 0) + dt * rate;
        while (z.acc >= 1) { z.acc -= 1; particles.push({ i, s: 0, v: .55 + Math.random() * .35, j: (Math.random() - .5) * 10 }); }
        // sound rings above the instrument, spaced by pitch
        z.ringT -= dt;
        if (z.ringT <= 0 && z.amp > .5) { rings.push({ x: n.x, r: 0, a: 1 }); z.ringT = .3 * (262 / n.freq); }
      }
    });

    // particles
    g.globalCompositeOperation = "lighter";
    for (let k = particles.length - 1; k >= 0; k--) {
      const p = particles[k];
      p.s += dt * p.v;
      if (p.s >= 1) { particles.splice(k, 1); continue; }
      const pts = airPath(NOTES[p.i].x);
      const [x, y, segIdx] = pointAt(pts, p.s);
      const fade = p.s > .85 ? (1 - p.s) / .15 : 1;
      const jx = segIdx >= 6 ? p.j * .4 : 0, jy = segIdx < 6 ? p.j : 0;
      const rad = g.createRadialGradient(x + jx, y + jy, 0, x + jx, y + jy, 7);
      rad.addColorStop(0, `rgba(190,240,255,${.55 * fade})`);
      rad.addColorStop(1, "rgba(60,200,255,0)");
      g.fillStyle = rad;
      g.beginPath(); g.arc(x + jx, y + jy, 7, 0, Math.PI * 2); g.fill();
    }
    // rings
    for (let k = rings.length - 1; k >= 0; k--) {
      const r = rings[k];
      r.r += dt * 120; r.a -= dt * 1.4;
      if (r.a <= 0) { rings.splice(k, 1); continue; }
      g.beginPath();
      g.arc(r.x, 365, 30 + r.r, Math.PI * 1.18, Math.PI * 1.82);
      g.strokeStyle = `rgba(110,215,255,${r.a * .7})`; g.lineWidth = 3;
      g.stroke();
    }
    g.globalCompositeOperation = "source-over";

    stepEls.forEach((el, k) => el.classList.toggle("on", anyOn && k <= stage));
    if (!anyOn && lastNote !== null && viz.every(z => z.amp < .05)) label.classList.remove("on");
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
